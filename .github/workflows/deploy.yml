name: Deploy to EC2

on:
  push:
    branches: [main]

jobs:
  build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Docker Hub 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 이미지 빌드 & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/capstone-design:latest

  deploy:
    name: Deploy to EC2
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 설정 파일 EC2로 복사
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.yml,observability"
          target: ~/app

      - name: .env 생성 & 컨테이너 재시작
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            mkdir -p ~/app

            # .env 파일 생성
            # GITHUB_APP_PRIVATE_KEY: PEM 내용을 \n 이스케이프된 한 줄로 저장할 것
            #   ex) -----BEGIN RSA PRIVATE KEY-----\nMIIE...\n-----END RSA PRIVATE KEY-----
            cat > ~/app/.env << 'EOF'
            # [docker-compose] image pull 인증
            DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}

            # [app] spring.datasource / docker-compose mysql 포트 매핑
            DB_URL=${{ secrets.DB_URL }}
            DB_USERNAME=${{ secrets.DB_USERNAME }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}

            # [app] auth.jwt
            JWT_ACCESS_KEY=${{ secrets.JWT_ACCESS_KEY }}
            JWT_REFRESH_KEY=${{ secrets.JWT_REFRESH_KEY }}

            # [app] spring.cloud.aws
            AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
            AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
            SQS_REGION=${{ secrets.SQS_REGION }}
            SQS_ANALYSIS_QUEUE=${{ secrets.SQS_ANALYSIS_QUEUE }}
            SQS_DLQ=${{ secrets.SQS_DLQ }}
            SQS_NOTIFICATION_QUEUE=${{ secrets.SQS_NOTIFICATION_QUEUE }}
            S3_BUCKET_NAME=${{ secrets.S3_BUCKET_NAME }}

            # [app] spring.security.oauth2 / github app
            GITHUB_CLIENT_ID=${{ secrets.GH_CLIENT_ID }}
            GITHUB_CLIENT_SECRET=${{ secrets.GH_CLIENT_SECRET }}
            GITHUB_APP_ID=${{ secrets.GH_APP_ID }}
            GITHUB_APP_PRIVATE_KEY=${{ secrets.GH_APP_PRIVATE_KEY }}
            GITHUB_APP_STATE_SECRET=${{ secrets.GH_APP_STATE_SECRET }}
            GITHUB_WEBHOOK_SECRET=${{ secrets.GH_WEBHOOK_SECRET }}

            # [app] app.frontend
            FRONTEND_BASE_URL=${{ secrets.FRONTEND_BASE_URL }}
            FRONTEND_REDIRECT_URL=${{ secrets.FRONTEND_REDIRECT_URL }}

            # [grafana] 관리자 비밀번호 / 외부 접근 포트 / 서브패스 설정
            GRAFANA_PASSWORD=${{ secrets.GRAFANA_PASSWORD }}
            GRAFANA_HOST_PORT=3000
            GF_SERVER_ROOT_URL=https://capstone-project-lxp.duckdns.org/grafana/
            GF_SERVER_SERVE_FROM_SUB_PATH=true

            # [docker-compose] 앱·DB 호스트 포트 매핑
            APP_HOST_PORT=${{ secrets.APP_HOST_PORT }}
            DB_HOST_PORT=${{ secrets.DB_HOST_PORT }}

            # [prometheus] prod 설정 파일 경로 (PROMETHEUS_CONFIG는 Prometheus Java 클라이언트가 선점하므로 다른 이름 사용)
            PROMETHEUS_SERVER_CONFIG=./observability/prometheus/prometheus-prod.yml
            # [alloy] 로그 env 라벨
            APP_ENV=prod

            # [app] auth.jwt.cookie-secure / OAuth2 redirect
            COOKIE_SECURE=true
            OAUTH_REDIRECT_URI=https://capstone-project-lxp.duckdns.org/login/oauth2/code/github
            EOF

            chmod 600 ~/app/.env

            # Docker Hub 로그인 (private image pull용)
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            cd ~/app
            docker compose pull app
            docker compose --profile prod up -d
            docker image prune -f
