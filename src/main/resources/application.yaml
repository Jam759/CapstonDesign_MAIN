server:
  forward-headers-strategy: FRAMEWORK

spring:
  threads:
    virtual:
      enabled: true
  main:
    keep-alive: true

  application:
    name: CapstoneDesign

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3316/capstone_design?useSSL=false&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}

  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:root}
      timeout: ${REDIS_TIMEOUT:2s}

  jpa:
    hibernate:
      ddl-auto: create  #prod -> update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        generate_statistics: false
    show-sql: false
    defer-datasource-initialization: true

  sql:
    init:
      mode: always
      continue-on-error: false   # 진단용: seed 실패 원인 노출. 확인 후 true 로 되돌리세요.

  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
            scope: read:user
            redirect-uri: "${OAUTH_REDIRECT_URI:http://localhost:8080/login/oauth2/code/{registrationId}}"

  cloud:
    aws:
      sqs:
        queue-not-found-strategy: FAIL
      region:
        static: ${SQS_REGION}
      credentials:
        access-key: ${AWS_ACCESS_KEY_ID}
        secret-key: ${AWS_SECRET_ACCESS_KEY}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: ${app.logging.service:capstone-main}
      server_type: ${app.logging.server-type:spring}
    distribution:
      percentiles-histogram:
        http.server.requests: true

app:
  frontend:
    baseUrl: ${FRONTEND_BASE_URL:http://localhost:5173}
  aws:
    sqs:
      analysis-queue: ${SQS_ANALYSIS_QUEUE}
      dlq-queue: ${SQS_DLQ}
      notification-queue: ${SQS_NOTIFICATION_QUEUE}
    s3:
      bucket-name: ${S3_BUCKET_NAME}
  logging:
    service: capstone-main
    server-type: spring
    directory: ./.logs
    console-enabled: ${APP_LOGGING_CONSOLE_ENABLED:true}
    structured-enabled: ${APP_LOGGING_STRUCTURED_ENABLED:true}
    exclude-paths:
      - /favicon.ico
      - /actuator/health
      - /actuator/prometheus
      - /
    debug-aspect:
      enabled: true
      max-string-length: 120
      max-collection-size: 10
      log-return-value: true

auth:
  jwt:
    issuer: "HoseoCapstoneDesign"
    access-key: ${JWT_ACCESS_KEY}
    refresh-key: ${JWT_REFRESH_KEY}
    access-ttl: 15 #min
    refresh-ttl: 7 # days
    cookie-name: "REFRESH_TOKEN"  #prod -> os var
    cookie-http-only: ${COOKIE_HTTP_ONLY:false}
    cookie-secure: ${COOKIE_SECURE:true}
    cookie-samesite: "None"
    front-redirect-url: "${FRONTEND_REDIRECT_URL:http://localhost:5173/install-app/auth-test.html}"

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace

mybatis:
  mapper-locations: classpath:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

github:
  app:
    app-id: ${GITHUB_APP_ID}
    private-key: ${GITHUB_APP_PRIVATE_KEY}
    state-secret: ${GITHUB_APP_STATE_SECRET}
  webhook:
    secret: ${GITHUB_WEBHOOK_SECRET}
