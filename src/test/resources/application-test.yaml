spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:capstone-test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
    show-sql: false
  sql:
    init:
      mode: never
  cloud:
    aws:
      region:
        static: ap-northeast-2
      credentials:
        access-key: test-access-key
        secret-key: test-secret-key
  security:
    oauth2:
      client:
        registration:
          github:
            client-id: test-client-id
            client-secret: test-client-secret

app:
  frontend:
    baseUrl: http://localhost:5173
  aws:
    sqs:
      analysis-queue: test-analysis-queue
      dlq-queue: test-dlq-queue
      notification-queue: test-notification-queue
    s3:
      bucket-name: test-bucket

